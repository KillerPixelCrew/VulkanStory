[Bootstrap]
; Enable early managed startup and preparation of the supported SDL/Vulkan profile.
; Rendering starts at the original window boundary after preparation succeeds.
Enabled=1
; Capture unhandled native crashes automatically, including Windows fast-fail.
CrashCapture=1
; AMD primary displays: allow legacy/JIT context continuations for this launch.
; Hardware shadow stacks stay enabled. No registry or game executable changes.
; Windows applies this at process creation, so the loader starts the original game once.
AmdContextCompatibility=1
; Optional absolute installed .NET root for unusual development environments.
; Empty follows DOTNET_ROOT_X64, DOTNET_ROOT, registered installation, Program Files.
DotnetRoot=
